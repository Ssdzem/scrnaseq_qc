reference_atlas:
  # Template: broad Liver Cell Atlas labels on CPU.
  enabled: true
  zip_url: "https://www.livercellatlas.org/data_files/toDownload/rawData_human.zip"
  # sha256 of the deposit this template was validated on. A mismatch stops the build.
  sha256:
    zip: "f18f7e696164a947cbd0d198ce5da56c7f66a3e0cf06a9820cde77f0ef4fb995"
  metadata_url: "https://www.livercellatlas.org/data_files/toDownload/annot_humanAll.csv"
  cache_dir: "data/ref/cache"
  extract_dir: "data/ref/rawData_human"
  matrix_subdir: "countTable_human"
  metadata_join_key: "cell"
  metadata_label_col: "annot"
  output_h5ad: "data/ref/lca_human_tier1_reference.h5ad"
  report: "data/ref/reference_build_report.tier1.json"
  ready_marker: "data/ref/.reference_tier1_ready"

integration:
  # Enable an integration backend. If false, uses PCA for graph/UMAP/Leiden.
  enabled: true
  # Required before execution. Choose exactly one: "sysvi", "scvi", or "harmony".
  method: "sysvi"
  # Primary batch/system key. For sysVI this can be generated from system_key_components below.
  batch_key: "sysvi_system"
  # The standardized inputs do not carry a canonical `technology` column, so derive it from platform+chemistry.
  obs_key_aliases:
    technology:
      components:
        - "platform"
        - "chemistry"
      separator: "__"
  # Use assay + derived technology + study_accession directly in the SysVI system key.
  system_key_components:
    - "assay"
    - "technology"
    - "study_accession"
  system_key_separator: "__"
  # Additional weaker nuisance covariates.
  categorical_covariate_keys: []
  continuous_covariate_keys: []
  # sysVI expects normalized log-expression; scVI defaults to counts when layer is omitted.
  layer: "log1p"
  # Embedding / graph parameters.
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  # Large integrated runs can skip PCA/UMAP while still computing graph/Leiden on X_integrated.
  compute_pca: false
  compute_umap: false
  compute_leiden: true
  # Backend for PCA / Harmony / neighbors / UMAP / Leiden graph steps.
  # - "cpu": always use Scanpy / HarmonyPy CPU implementations
  # - "gpu": require RAPIDS SingleCell implementations where available
  # - "auto": try RAPIDS SingleCell first, otherwise fall back to CPU
  backend: "cpu"
  # scVI/sysVI training knobs.
  scvi_max_epochs: 400
  sysvi_max_epochs: 400
  n_latent: 30
  batch_size: 4096
  validation_size: 0.1
  check_val_every_n_epoch: 1
  early_stopping: true
  early_stopping_monitor: "elbo_validation"
  early_stopping_patience: 30
  dl_num_workers: 4
  num_threads: 16
  # sysVI-specific model and loss settings.
  sysvi:
    prior: "vamp"
    n_prior_components: 20
    trainable_priors: true
    n_layers: 2
    n_hidden: 256
    dropout_rate: 0.1
    out_var_mode: "feature"
    embed_categorical_covariates: true
    weight_batches: true
    get_latent_mc_samples: 100
    plan_kwargs:
      z_distance_cycle_weight: 5.0
  # GPU settings for scVI/sysVI training. Set use_gpu false to force CPU;
  # require_gpu fails fast if CUDA is unavailable. For RAPIDS graph/preprocessing
  # steps, see integration.backend above.
  use_gpu: false
  require_gpu: false
  accelerator: "cpu"
  devices: 1
  float32_matmul_precision: "high"
  seed: 0

annotation:
  # Strategy options: "from_existing_column", "from_leiden", "symphony", or "scanvi".
  method: "scanvi"
  source_column: "cell_type"
  # Empty target_column writes to {annotation_method}_predicted_cell_type.
  target_column: "tier_1_cell_type"
  legacy_alias: "scanvi_pred"
  unknown_label: "Unknown"
  symphony:
    # Reference h5ad is supplied by Snakemake from reference_atlas.output_h5ad.
    reference_label_key: "cell_type"
    reference_batch_key: "sample"
    query_batch_key: "sample_id"
    # k in kNN label transfer.
    k: 5
  scanvi:
    # Reference h5ad is supplied by Snakemake from reference_atlas.output_h5ad.
    reference_label_key: "cell_type"
    # The myeloid atlas metadata has `sample`, not `sample_id`; leaving batch keys empty avoids a false mismatch.
    reference_batch_key: ""
    query_batch_key: ""
    counts_layer: "counts"
    # Training settings.
    scvi_max_epochs: 100
    scanvi_max_epochs: 30
    query_finetune_max_epochs: 20
    batch_size: 8192
    n_latent: 30
    min_shared_genes: 2000
    accelerator: "cpu"
    seed: 0

evaluation:
  # Empty label_key uses integration_annotation.annotation.target_column from the annotated h5ad.
  batch_key: "sample_id"
  label_key: ""
  unknown_label: "Unknown"
  # Extended benchmarking using scIB. Keep enabled, but evaluator records per-embedding errors instead of aborting all output.
  scib:
    enabled: true
    embeddings:
      - "X_integrated"
      - "X_scVI"
      - "X_sysVI"
      - "X_scanvi"
      - "X_symphony"
      - "X_harmony"
      - "X_pca_harmony"
      - "X_pca"
    ari: true
    nmi: true
    silhouette: true
    pcr: true
    cell_cycle: true
    hvg_overlap: true
    isolated_labels: true
    isolated_labels_f1: true
    isolated_labels_asw: true
    graph_connectivity: true
    trajectory: true
    kbet: true
    lisi_graph: true
    ilisi: true
    clisi: true
    type: "embed"
    lisi_subsample: 0.5
    n_cores: 1
    verbose: false

resources:
  integration_threads: 16
  integration_mem_mb: 64000
  integration_gpu: 0
  annotation_threads: 4
  annotation_mem_mb: 48000
  annotation_gpu: 0
  evaluation_threads: 1
  evaluation_mem_mb: 64000
