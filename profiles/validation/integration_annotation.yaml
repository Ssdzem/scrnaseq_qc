# validation override for integration_annotation (full copy of
# config/integration_annotation.yaml, validation deltas marked "VALIDATION:").
#
# No-GPU / 60 GiB box: Harmony integration (CPU) + scANVI label transfer (CPU)
# onto the bundled Liver Cell Atlas reference. The validation studies are all 10x
# scRNA-seq, so the cross-study batch effect is mild and a heavy sysVI/scVI
# integration is unnecessary. The reference is capped (reference_atlas.max_cells)
# so scANVI training fits CPU RAM, and the expensive scIB evaluation is disabled.
#
# NOTE: Harmony has been flaky in this environment. If `ia_integrate_*` fails on
# harmonypy, the lightest fallback is integration.method:"" with enabled:false
# (PCA only) — scANVI label transfer still runs and is enough to call macrophages.

reference_atlas:
  # Default/template label-transfer profile: broad Liver Cell Atlas tier-1 labels on CPU.
  enabled: true
  # VALIDATION: cap the reference for scANVI label transfer, stratified by
  # cell_type so all labels survive. The full 167k-cell atlas OOMs scVI training
  # on CPU. 0 = keep all cells.
  max_cells: 40000
  zip_url: "https://www.livercellatlas.org/data_files/toDownload/rawData_human.zip"
  metadata_url: "https://www.livercellatlas.org/data_files/toDownload/annot_humanAll.csv"
  cache_dir: "data/ref/cache"
  extract_dir: "data/ref/rawData_human"
  matrix_subdir: "countTable_human"
  metadata_join_key: "cell"
  metadata_label_col: "annot"
  output_h5ad: "data/ref/lca_human_tier1_reference.h5ad"
  report: "data/ref/reference_build_report.tier1.json"
  ready_marker: "data/ref/.reference_tier1_ready"

integration:
  # Enable an integration backend. If false, uses PCA for graph/UMAP/Leiden.
  enabled: true
  # VALIDATION: Harmony on CPU — all studies are 10x, mild batch.
  method: "harmony"
  # VALIDATION: same tech across studies -> correct the study batch directly.
  batch_key: "study_accession"
  # The standardized inputs do not carry a canonical `technology` column, so derive it from platform+chemistry.
  obs_key_aliases:
    technology:
      components:
        - "platform"
        - "chemistry"
      separator: "__"
  # Use assay + derived technology + study_accession directly in the SysVI system key.
  system_key_components:
    - "assay"
    - "technology"
    - "study_accession"
  system_key_separator: "__"
  # Additional weaker nuisance covariates.
  categorical_covariate_keys: []
  continuous_covariate_keys: []
  # sysVI expects normalized log-expression; scVI defaults to counts when layer is omitted.
  layer: "log1p"
  # Embedding / graph parameters.
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  # VALIDATION: Harmony operates on PCA, so PCA must be computed; UMAP kept for figures.
  compute_pca: true
  compute_umap: true
  compute_leiden: true
  # Backend for PCA / Harmony / neighbors / UMAP / Leiden graph steps.
  backend: "cpu"
  # scVI/sysVI training knobs.
  scvi_max_epochs: 400
  sysvi_max_epochs: 400
  n_latent: 30
  batch_size: 4096
  validation_size: 0.1
  check_val_every_n_epoch: 1
  early_stopping: true
  early_stopping_monitor: "elbo_validation"
  early_stopping_patience: 30
  dl_num_workers: 4
  num_threads: 8
  # sysVI-specific model and loss settings.
  sysvi:
    prior: "vamp"
    n_prior_components: 20
    trainable_priors: true
    n_layers: 2
    n_hidden: 256
    dropout_rate: 0.1
    out_var_mode: "feature"
    embed_categorical_covariates: true
    weight_batches: true
    get_latent_mc_samples: 100
    plan_kwargs:
      z_distance_cycle_weight: 5.0
  # VALIDATION: no GPU on this box — force CPU, never require CUDA.
  use_gpu: false
  require_gpu: false
  accelerator: "cpu"
  devices: 1
  float32_matmul_precision: "high"
  seed: 0

annotation:
  # VALIDATION: scANVI label transfer from the LCA reference (CPU).
  method: "scanvi"
  source_column: "cell_type"
  # Empty target_column writes to {annotation_method}_predicted_cell_type.
  target_column: "tier_1_cell_type"
  legacy_alias: "scanvi_pred"
  unknown_label: "Unknown"
  symphony:
    # Reference h5ad is supplied by Snakemake from reference_atlas.output_h5ad.
    reference_label_key: "cell_type"
    reference_batch_key: "sample"
    query_batch_key: "sample_id"
    # k in kNN label transfer.
    k: 5
  scanvi:
    # Reference h5ad is supplied by Snakemake from reference_atlas.output_h5ad.
    reference_label_key: "cell_type"
    # The LCA reference obs uses `sample`, not `sample_id`; leaving batch keys empty avoids a false mismatch.
    reference_batch_key: ""
    query_batch_key: ""
    counts_layer: "counts"
    # Training settings.
    scvi_max_epochs: 100
    scanvi_max_epochs: 30
    query_finetune_max_epochs: 20
    batch_size: 8192
    n_latent: 30
    min_shared_genes: 2000
    accelerator: "cpu"
    seed: 0

evaluation:
  # Empty label_key uses integration_annotation.annotation.target_column from the annotated h5ad.
  batch_key: "sample_id"
  label_key: ""
  unknown_label: "Unknown"
  scib:
    # VALIDATION: scIB benchmarking is the 40-core / >100 GiB memory hog; off to avoid OOM.
    enabled: false
    embeddings:
      - "X_integrated"
      - "X_scVI"
      - "X_sysVI"
      - "X_scanvi"
      - "X_symphony"
      - "X_harmony"
      - "X_pca_harmony"
      - "X_pca"
    ari: true
    nmi: true
    silhouette: true
    pcr: true
    cell_cycle: true
    hvg_overlap: true
    isolated_labels: true
    isolated_labels_f1: true
    isolated_labels_asw: true
    graph_connectivity: true
    trajectory: true
    kbet: true
    lisi_graph: true
    ilisi: true
    clisi: true
    type: "embed"
    lisi_subsample: 0.5
    n_cores: 1
    verbose: false

resources:
  # VALIDATION: capped for the 60 GiB / no-GPU box.
  integration_threads: 8
  integration_mem_mb: 40000
  integration_gpu: 0
  annotation_threads: 8
  annotation_mem_mb: 40000
  annotation_gpu: 0
  evaluation_threads: 4
  evaluation_mem_mb: 24000
