study: "GSE136103"

# Validation cohort (held-out F0/F4). Per-sample 10x triplets unpacked from
# GSE136103_RAW.tar by the fetch module (rule fetch_extract, extract: triplet)
# into one dir per GSM, which count_matrix_10x_multi_runs reads via triplet_layout.
input:
  runs_csv: "config/liver_scRNAseq_metadata_validation.csv"
  triplet_root: "out/GSE136103/raw/triplets"
  triplet_layout: "{triplet_root}/{sample_id}"
  qc:
    method: "mad"
    k: 3
    # P1-STD-03 — CROSS-COHORT CAVEAT, state this in any methods section.
    # mito_upper_k is NOT uniform across the project: GSE256398 and HRA007511 (both
    # DISCOVERY) use 7; GSE202379, GSE244832 and all three VALIDATION cohorts
    # (GSE136103, GSE168933, GSE181483) use 5. A larger k is a MORE PERMISSIVE
    # mitochondrial ceiling, so two discovery studies were filtered more leniently than
    # everything they are compared against. The divergence is deliberate per-study
    # tuning, but it was nowhere recorded as a caveat.
    mito_upper_k: 5
    mito_gene_prefix: "MT-"
    miqc_posterior_cutoff: 0.75
    doublet_score_threshold: 0.25

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/GSE136103/raw.h5ad"
