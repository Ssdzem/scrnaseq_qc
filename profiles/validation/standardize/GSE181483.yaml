study: "GSE181483"

# Validation cohort (held-out F0/F4). Included samples (GSM5741404-7) ship as
# nested per-sample tar.gz inside GSE181483_RAW.tar; the fetch module (rule
# fetch_extract, extract: triplet) unpacks each nested archive into one triplet
# dir per GSM, which count_matrix_10x_multi_runs reads via triplet_layout.
input:
  runs_csv: "config/liver_scRNAseq_metadata_validation.csv"
  triplet_root: "out/GSE181483/raw/triplets"
  triplet_layout: "{triplet_root}/{sample_id}"
  qc:
    method: "mad"
    k: 3
    mito_upper_k: 5
    mito_gene_prefix: "MT-"
    miqc_posterior_cutoff: 0.75
    doublet_score_threshold: 0.25

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/GSE181483/raw.h5ad"
