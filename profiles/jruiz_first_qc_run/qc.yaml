# jruiz_first_qc_run override for the qc_preproc module (full copy of config/qc.yaml).
# Same QC thresholds as the default; only the inputs pointer is scoped to the
# two Lei_2022_NGDC studies wired up under profiles/jruiz_first_qc_run/standardize/.

qc:
  # Minimum number of genes detected in a cell.
  min_genes: 200

  # Minimum total UMI counts in a cell.
  min_counts: 500

  # Maximum fraction of mitochondrial counts (0-1).
  max_mito_frac: 0.20

  # Minimum number of cells a gene must be detected in.
  min_cells_per_gene: 3

  # Whether to keep (True) or drop (False) doublets (if computed).
  keep_doublets: true

  # If True, infer mitochondrial genes as those starting with "MT-".
  mito_prefix: "MT-"

  # Optional: if provided, treat these prefixes as mitochondrial too.
  mito_prefixes_extra: []

  # Whether to run pre-filter QC plots.
  make_figures: true

  # Batch key used when selecting HVGs.
  hvg_batch_key: "sample_id"

  # Batch key used by scVI integration.
  scvi_batch_key: "sample_id"

  # Number of HVGs used for exploratory embeddings.
  hvg_n_top_genes: 3000

  backend: "cpu"

  # If true and backend is "gpu" or "auto", fail instead of falling back when GPU is unavailable.
  require_gpu: false

  # Random seed for reproducibility.
  seed: 0

inputs:
  # Explicit list: only the two studies wired up in this profile's
  # standardize/ dir. Bypasses metadata_csv-based auto-discovery, which would
  # otherwise also pick up the other 3 (not-yet-wired) compendium datasets
  # via their study_accession placeholder and fail with missing raw.h5ad.
  studies: ["Lei_2022_NGDC_normal", "Lei_2022_NGDC_pre_RCT"]

  # Cervical cancer compendium (converted from ../../metadata_compendio_muestras.tsv,
  # comma-delimited, with a study_accession column added — see
  # config/metadata_compendio_muestras.csv header comment / conversion script
  # for how study_accession is derived). Per-sample attach in
  # qc_preproc/scripts/attach_metadata.py joins on sample_id, which matches
  # the NC1-3 / CESC-Adv1-5 sample_ids produced by standardize's count_txt cleaner.
  metadata_csv: "config/metadata_compendio_muestras.csv"

resources:
  preintegration_threads: 4
  preintegration_mem_mb: 32000
  preintegration_gpu: 0
  concat_threads: 4
  concat_mem_mb: 64000
