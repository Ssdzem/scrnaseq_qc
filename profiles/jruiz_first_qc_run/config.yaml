# a1_p1_qc "jruiz_first_qc_run" profile — first standardize pass for the
# Lei_2022_NGDC (NGDC/OMIX001005) cohort.
#
# Lei_2022_NGDC ships as dense per-sample `.count.txt` tables that are already
# sitting on disk under ../../raw_data/Lei_2022_NGDC (no GEO tarball, so the
# fetch module is not involved). Split into two standardize studies because
# the two sample groups have opposite matrix orientations:
#   - Lei_2022_NGDC_normal   (normal/):  genes x cells
#   - Lei_2022_NGDC_pre_RCT  (pre_RCT/): cells x genes
# See profiles/jruiz_first_qc_run/standardize/*.yaml for the per-study specs.
#
# Run from pipeline/qc/, e.g.:
#   snakemake --profile profiles/jruiz_first_qc_run -s workflow/modules/standardize/Snakefile -n -p standardize_all
cores: 8
printshellcmds: true
rerun-incomplete: true
keep-going: true
use-conda: true
config:
  - profile_config_dir=profiles/jruiz_first_qc_run
