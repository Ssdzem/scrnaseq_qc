study: "S-BSST1035"

# Li C et al. 2023 (EBI/BioStudies) — 6 primary HPV+ tumors (3 adenocarcinoma,
# 3 SCC). Flat `counts/` directory with an `<sample_id>` filename prefix and,
# critically, **no barcodes.tsv.gz** (never deposited by the authors), so
# synthesize_missing_barcodes fabricates positional cell ids from the
# MatrixMarket header into the staging dir. Stage the per-run layout first:
#
#   python profiles/jruiz_first_qc_run/stage_flat_triplets.py \
#     --runs-csv profiles/jruiz_first_qc_run/runs/S-BSST1035_runs.csv \
#     --study S-BSST1035 \
#     --source-dir /STORAGE/csbig/jruiz/Single_cell_CaCu/raw_data/S-BSST1035/counts \
#     --triplet-root out/S-BSST1035/triplets
#
# Staged outside out/{study}/raw on purpose: standardize_unpack_study gunzips
# every .gz it finds under raw/, which would inflate each matrix needlessly.
input:
  # Matrices are the largest in the compendium (up to 34M nonzeros); keep the
  # per-run pool narrow so peak RSS stays bounded.
  workers: 3
  mem_mb: 48000
  runs_csv: "profiles/jruiz_first_qc_run/runs/S-BSST1035_runs.csv"
  triplet_root: "out/S-BSST1035/triplets"
  triplet_layout: "{triplet_root}/{run_id}"
  synthesize_missing_barcodes: true
  # run_id is what count_matrix_10x_multi_runs hands to tenx_h5_multi as
  # sample_id, so it is pinned to the compendium sample_id (AD1, SCC1, ...).
  # No 'qc:' block on purpose (same rationale as the Lei_2022_NGDC specs):
  # tenx_h5_multi only runs its per-sample MAD / miQC-like cell filter when
  # input.qc is set, so leaving it out keeps raw.h5ad genuinely unfiltered and
  # cutoffs get picked from the standardize_qc_distributions figures/table.
  # Only used for the %mito figure below (not for filtering).
  mito_gene_prefix: "MT-"

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/S-BSST1035/raw.h5ad"
