study: "Lei_2022_NGDC_pre_RCT"

# Lei et al. 2022 (NGDC/OMIX001005) — 5 advanced cervical cancer biopsies,
# 1 week pre-RCT (CESC-Adv1-5). Dense tab-separated *.count.txt, one file per
# sample, cells as rows / genes as columns (opposite orientation from
# normal) — pin genes_in explicitly rather than relying on shape-based
# auto-detection.
input:
  raw_dir: "/STORAGE/csbig/jruiz/Single_cell_CaCu/raw_data/Lei_2022_NGDC/pre_RCT"
  pattern: "*.count.txt"
  suffix: ".count.txt"
  sep: "\t"
  genes_in: "columns"
  # No 'qc:' block on purpose: tenx_h5_multi only runs its per-sample MAD /
  # miQC-like cell filter when input.qc is set (see standardize_dependencies /
  # tenx_h5_multi._prepare_loaded_sample, `if qc_cfg is not None`). Leaving it
  # out keeps raw.h5ad genuinely unfiltered so cutoffs get picked from the
  # standardize_qc_distributions figures/table instead of a preset MAD rule.
  # Only used for the %mito figure below (not for filtering).
  mito_gene_prefix: "MT-"

pipeline:
  cleaner1: "count_txt"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/Lei_2022_NGDC_pre_RCT/raw.h5ad"
