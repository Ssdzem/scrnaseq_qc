study: "GSE197461"

# Qiu et al. 2023 (GEO) — 8 treatment-naive primary tumors, FIGO IB-IIA
# (3 SCC, 5 adenocarcinoma). Ships 10x MTX triplets, but all 8 samples sit in
# one flat `counts/` directory with a `GSM<accession>_<sample_id>_` filename
# prefix, which count_matrix_10x_multi_runs cannot address (it expects fixed
# filenames inside a per-run directory). profiles/jruiz_first_qc_run/
# stage_flat_triplets.py builds that layout under triplet_root first:
#
#   python profiles/jruiz_first_qc_run/stage_flat_triplets.py \
#     --runs-csv profiles/jruiz_first_qc_run/runs/GSE197461_runs.csv \
#     --study GSE197461 \
#     --source-dir /STORAGE/csbig/jruiz/Single_cell_CaCu/raw_data/GSE197461/counts \
#     --triplet-root out/GSE197461/triplets
#
# Staged outside out/{study}/raw on purpose: standardize_unpack_study gunzips
# every .gz it finds under raw/, which would inflate each matrix needlessly.
input:
  workers: 8
  runs_csv: "profiles/jruiz_first_qc_run/runs/GSE197461_runs.csv"
  triplet_root: "out/GSE197461/triplets"
  triplet_layout: "{triplet_root}/{run_id}"
  # run_id is what count_matrix_10x_multi_runs hands to tenx_h5_multi as
  # sample_id, so it is pinned to the compendium sample_id (SCC_1, ADC_1, ...).
  # No 'qc:' block on purpose (same rationale as the Lei_2022_NGDC specs):
  # tenx_h5_multi only runs its per-sample MAD / miQC-like cell filter when
  # input.qc is set, so leaving it out keeps raw.h5ad genuinely unfiltered and
  # cutoffs get picked from the standardize_qc_distributions figures/table.
  # Only used for the %mito figure below (not for filtering).
  mito_gene_prefix: "MT-"

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/GSE197461/raw.h5ad"
