# validation override for the fetch module (full copy of config/fetch.yaml).
# Scopes fetch to the 3 held-out studies and declares the GEO `*_RAW.tar`
# extraction handled by the fetch_extract rule.

paths:
  # Project root (repo-relative). Used to build all other paths.
  project_root: "."

  # Held-out validation cohorts (F0/F4) — distinct from the discovery metadata.
  metadata_csv: "config/liver_scRNAseq_metadata_validation.csv"

  # Output root directory. Per-study subdirectories are created under here.
  out_root: "out"

  # Where this module lives (repo-relative).
  module_dir: "workflow/modules/fetch"

# All validation studies are GEO supplementary downloads (curl), not GSA/CNCB,
# so Aspera is off here.
aspera:
  enabled: false
  ascp_path: ""
  key_path: ""
  port: 33001
  rate_limit: "50m"
  host: "aspera01@download.cncb.ac.cn"
  remote_root: "gsa-human"

# Per-study unpacking of the downloaded GEO `*_RAW.tar` into the layout each
# standardize cleaner expects (rule fetch_extract -> scripts/extract_raw_archive.py):
#   triplet  per-sample 10x triplets  -> count_matrix_10x_multi_runs
#   csv      per-sample count CSVs    -> csv_handler
extract:
  GSE136103: triplet
  GSE181483: triplet
  GSE168933: csv
