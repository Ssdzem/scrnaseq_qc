name: qc_preproc_gpu_py
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy
  - anndata
  - numpy
  - pandas
  - scipy
  - pyyaml
  - scikit-misc
  - pip
  - pip:
      # Swap to rapids-singlecell-cu13 on CUDA 13 hosts.
      - "--extra-index-url=https://pypi.nvidia.com"
      - "rapids-singlecell-cu12[rapids]==0.14.1"
