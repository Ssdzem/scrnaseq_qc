name: integration_annotation_gpu_py
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy>=1.10
  - anndata>=0.12.5
  - pandas>=2.1,!=2.1.2
  - numpy
  - scipy
  - pyyaml
  - python-igraph
  - leidenalg
  - harmonypy
  - pip
  - pip:
      # CUDA 11.8 PyTorch wheels are compatible with NVIDIA 525-series drivers.
      # RAPIDS is intentionally omitted because current profiles keep
      # integration.backend="cpu" while using GPU only for scvi-tools training.
      - "--extra-index-url=https://download.pytorch.org/whl/cu118"
      - "torch==2.7.1+cu118"
      - "scvi-tools>=1.3"
      - "symphonypy>=0.2.1"
      - "scib"
