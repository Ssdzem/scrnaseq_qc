name: integration_annotation_gpu_py
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - scanpy>=1.10
  - anndata>=0.12.5
  - pandas>=2.1,!=2.1.2
  - numpy
  - scipy
  - pyyaml
  - python-igraph
  - leidenalg
  - harmonypy
  - pip
  - pip:
      # Swap to rapids-singlecell-cu13 on CUDA 13 hosts.
      - "--extra-index-url=https://pypi.nvidia.com"
      - "rapids-singlecell-cu12[rapids]==0.14.1"
      - "scvi-tools>=1.3"
      - "symphonypy>=0.2.1"
      - "scib"
