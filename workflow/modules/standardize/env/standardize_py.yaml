# Versions are pinned: unpinned, this env once solved to scanpy 1.11.5 with scipy 1.17.1,
# whose scrublet crashes, and pynndescent 0.7 breaks scanpy's neighbour graph. Change a pin only after rerunning a real study.
name: scrnaseq_qc_standardize
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - pip
  - numpy=2.4.6
  - pandas=2.3.3
  - scipy=1.18.0
  - anndata=0.12.18
  - scanpy=1.12.1
  # pynndescent 0.7 returns sparse arrays that scanpy 1.12.1 cannot read (no .getnnz).
  - pynndescent=0.5.13
  - scikit-learn=1.9.1
  - pyyaml=6.0.3
  - h5py=3.16.0
