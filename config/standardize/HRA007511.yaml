study: "HRA007511"

input:
  # Optional module-local worker override for standardize step.
  # (Can also be set globally via env var A1_P1_STANDARDIZE_WORKERS)
  # workers: 8
  runs_csv: "config/liver_scRNAseq_metadata_everything.csv"
  triplet_root: "out/HRA007511/counts/singleton/run"
  triplet_layout: "{triplet_root}/{donor_id}/{sample_id}/{run_id}/shell/{run_id}/outs/filtered"
  qc:
    method: "mad"
    k: 3
    mito_upper_k: 7
    mito_gene_prefix: "MT-"
    miqc_posterior_cutoff: 0.75
    doublet_score_threshold: 0.25
  # Optional test knobs (YAML):
  # run_ids: ["HRR1782781"]
  # max_runs: 1

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/HRA007511/raw.h5ad"
