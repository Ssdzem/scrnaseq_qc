integration:
  # Enable an integration backend. If false, uses PCA for graph/UMAP/Leiden.
  enabled: true
  # Integration backend: "scvi" or "harmony".
  method: "scvi"
  # Which obs key to use as the primary scVI batch for integration.
  batch_key: "study_accession"
  # Additional obs keys to correct as categorical covariates in scVI.
  categorical_covariate_keys:
    - "assay"
  continuous_covariate_keys: []
  # Embedding / graph parameters.
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  # Skip PCA/UMAP for the million-cell scVI path unless explicitly needed.
  compute_pca: false
  compute_umap: false
  compute_leiden: true
  # scVI-specific training knobs.
  scvi_max_epochs: 400
  n_latent: 30
  batch_size: 4096
  validation_size: 0.1
  check_val_every_n_epoch: 1
  early_stopping: true
  early_stopping_monitor: "elbo_validation"
  early_stopping_patience: 20
  dl_num_workers: 4
  num_threads: 16
  # GPU settings. Set use_gpu false to force CPU; require_gpu fails fast if CUDA is unavailable.
  use_gpu: true
  require_gpu: true
  accelerator: "gpu"
  devices: 1
  float32_matmul_precision: "high"
  seed: 0

annotation:
  # Strategy options: "from_existing_column", "from_leiden", "symphony", "scanvi", or fallback to Unknown.
  method: "scanvi"
  # Only used when method="from_existing_column": copy labels from this obs column.
  source_column: "cell_type"
  # Output label column written for ALL methods (including symphony/scanvi predictions).
  target_column: "cell_type"
  # Fallback label for missing/empty predictions or unmatched branches.
  unknown_label: "Unknown"
  symphony:
    # Reference atlas with precomputed PCA/harmony context suitable for Symphony mapping.
    reference_h5ad: "data/ref/lca_human_reference.h5ad"
    # Label column in reference atlas to transfer to query cells.
    reference_label_key: "annot"
    # Optional batch columns.
    reference_batch_key: "patient"
    query_batch_key: "study_accession"
  scanvi:
    # Reference atlas containing known labels for semi-supervised transfer.
    reference_h5ad: "data/ref/lca_human_reference.h5ad"
    reference_label_key: "annot"
    # Reference-only batch covariate for SCVI/SCANVI setup (must exist in reference obs).
    # Leave empty to disable SCANVI batch covariates.
    reference_batch_key: "patient"
    # Optional query batch column to map into reference_batch_key during query adaptation.
    # Leave empty to avoid query-side batch correction metadata; query cells use one reference batch value.
    query_batch_key: ""
    # Deprecated alias for reference_batch_key (kept for backward compatibility).
    batch_key: ""
    counts_layer: "counts"
    # Compute backend. Set use_gpu: false to force CPU execution.
    use_gpu: false
    # Optional explicit override: "cpu" or "gpu". Leave empty to use use_gpu.
    accelerator: "cpu"
    # Training settings.
    scvi_max_epochs: 100
    scanvi_max_epochs: 30
    query_finetune_max_epochs: 20
    n_latent: 30
    batch_size: 8192
    min_shared_genes: 2000
    seed: 0

evaluation:
  # Keys used by the lightweight evaluator.
  batch_key: "sample_id"
  label_key: "cell_type"
  unknown_label: "Unknown"
  # Extended benchmarking using scIB.
  scib:
    enabled: true
    # Embeddings to benchmark if present in adata.obsm.
    embeddings:
      - "X_integrated"
      - "X_scVI"
      - "X_scanvi"
      - "X_symphony"
      - "X_harmony"
      - "X_pca_harmony"
      - "X_pca"
    # scib.metrics.metrics options (set to true to include all metric families).
    ari: true
    nmi: true
    silhouette: true
    pcr: true
    cell_cycle: true
    hvg_overlap: true
    isolated_labels: true
    isolated_labels_f1: true
    isolated_labels_asw: true
    graph_connectivity: true
    trajectory: true
    kbet: true
    lisi_graph: true
    ilisi: true
    clisi: true
    type: "embed"
    lisi_subsample: 0.5
    n_cores: 1
    verbose: false


reference_atlas:
  # Build a local reference h5ad from the Liver Cell Atlas raw 10x triplets + metadata.
  enabled: true
  zip_url: "https://www.livercellatlas.org/data_files/toDownload/rawData_human.zip"
  metadata_url: "https://www.livercellatlas.org/data_files/toDownload/annot_humanAll.csv"
  matrix_subdir: "countTable_human"
  metadata_join_key: "cell"
  metadata_label_col: "annot"
  cache_dir: "data/ref/cache"
  extract_dir: "data/ref/rawData_human"
