integration:
  # Enable an integration backend. If false, uses PCA for graph/UMAP/Leiden.
  enabled: true
  # Integration backend: "scvi" or "harmony".
  method: "scvi"
  # Which obs key to use as batch for integration.
  batch_key: "sample_id"
  # Embedding / graph parameters.
  n_pcs: 50
  n_neighbors: 15
  leiden_resolution: 1.0
  # scVI-specific training knobs.
  scvi_max_epochs: 100
  seed: 0

annotation:
  # Strategy options: "from_existing_column", "from_leiden", "symphony", "scanvi", or fallback to Unknown.
  method: "from_existing_column"
  source_column: "cell_type"
  target_column: "cell_type"
  unknown_label: "Unknown"
  symphony:
    # Reference atlas with precomputed PCA/harmony context suitable for Symphony mapping.
    reference_h5ad: "out/integration_annotation/reference/lca_human_reference.h5ad"
    # Label column in reference atlas to transfer to query cells.
    reference_label_key: "annot"
    # Optional batch columns.
    reference_batch_key: "sample_id"
    query_batch_key: "sample_id"
    # k in kNN label transfer.
    k: 5
  scanvi:
    # Reference atlas containing known labels for semi-supervised transfer.
    reference_h5ad: "out/integration_annotation/reference/lca_human_reference.h5ad"
    reference_label_key: "annot"
    # Batch key and optional counts layer used for SCVI/SCANVI setup.
    batch_key: "sample_id"
    counts_layer: "counts"
    # Training settings.
    scvi_max_epochs: 100
    scanvi_max_epochs: 30
    n_latent: 30
    seed: 0

evaluation:
  # Keys used by the lightweight evaluator.
  batch_key: "sample_id"
  label_key: "cell_type"
  unknown_label: "Unknown"
  # Extended benchmarking using scIB.
  scib:
    enabled: true
    # Embeddings to benchmark if present in adata.obsm.
    embeddings:
      - "X_integrated"
      - "X_scVI"
      - "X_scanvi"
      - "X_symphony"
      - "X_harmony"
      - "X_pca_harmony"
      - "X_pca"
    # scib.metrics.metrics options (set to true to include all metric families).
    ari: true
    nmi: true
    silhouette: true
    pcr: true
    cell_cycle: true
    hvg_overlap: true
    isolated_labels: true
    isolated_labels_f1: true
    isolated_labels_asw: true
    graph_connectivity: true
    trajectory: true
    kbet: true
    lisi_graph: true
    ilisi: true
    clisi: true
    type: "embed"
    lisi_subsample: 0.5
    n_cores: 1
    verbose: false


reference_atlas:
  # Build a local reference h5ad from the Liver Cell Atlas raw 10x triplets + metadata.
  enabled: false
  zip_url: "https://www.livercellatlas.org/data_files/toDownload/rawData_human.zip"
  metadata_url: "https://www.livercellatlas.org/data_files/toDownload/annot_humanAll.csv"
  matrix_subdir: "countTable_human"
  metadata_join_key: "cell"
  metadata_label_col: "annot"
  cache_dir: "out/integration_annotation/reference/cache"
  extract_dir: "out/integration_annotation/reference/rawData_human"
