# QC configuration for the qc_preproc module.
#
# P1-QC-01 — READ THIS BEFORE WRITING A METHODS SECTION.
# This file does NOT hold the project's cell-filtering thresholds. It once appeared to:
# min_genes (200), min_counts (500), max_mito_frac (0.20), min_cells_per_gene (3) and
# keep_doublets were listed here under a header inviting the user to edit them, but the
# only code that read them — workflow/modules/qc_preproc/scripts/qc_scanpy.py, the sole
# caller of sc.pp.filter_cells / filter_genes — was wired into no rule and never ran.
# Editing them changed nothing. They have been REMOVED rather than wired, because the
# real filtering already happens elsewhere and wiring them would double-filter.
#
# Where cells are ACTUALLY filtered, in order:
#   1. standardize — per-study MAD (k=3), mito_upper_k 5 (validation) or 7
#      (GSE256398, HRA007511 — see P1-STD-03), miQC 0.75, doublet score 0.25
#   2. a1_p2_def qc_filter — min_genes 500/1000, max_genes 6000, min_total_counts 1000,
#      max_pct_counts_mt 10, miQC 0.75
#
# A methods section written from the OLD version of this file would have stated a 20%
# mitochondrial ceiling at this stage. The ceiling actually applied is per-study MAD
# upstream and 10% downstream.
#
# What remains below IS live: mito_prefix/mito_prefixes_extra/make_figures drive
# qc_figures.py (metrics and plots only, no filtering); hvg_*/scvi_batch_key/seed/
# backend/require_gpu drive explore_scanpy.py.

qc:
  # If True, infer mitochondrial genes as those starting with "MT-".
  mito_prefix: "MT-"

  # Optional: if provided, treat these prefixes as mitochondrial too.
  mito_prefixes_extra: []

  # Whether to run pre-filter QC plots.
  make_figures: true

  # Batch key used when selecting HVGs.
  hvg_batch_key: "sample_id"

  # Batch key used by scVI integration.
  scvi_batch_key: "sample_id"

  # Number of HVGs used for exploratory embeddings.
  hvg_n_top_genes: 3000

  # Preprocessing backend for the pre-integration Scanpy-like steps.
  # - "cpu": always use Scanpy/NumPy on CPU
  # - "gpu": require RAPIDS SingleCell GPU preprocessing
  # - "auto": try RAPIDS SingleCell GPU preprocessing, otherwise fall back to CPU
  backend: "cpu"

  # If true and backend is "gpu" or "auto", fail instead of falling back when GPU is unavailable.
  require_gpu: false

  # Random seed for reproducibility.
  seed: 0

inputs:
  # Which studies to process. If empty, process all directories under data_backup.
  # Example:
  # studies: ["GSE202379", "GSE244832"]
  studies: []

  # Source of truth for which study_accession values exist.
  metadata_csv: "config/liver_scRNAseq_metadata_everything.csv"

resources:
  preintegration_threads: 4
  preintegration_mem_mb: 32000
  preintegration_gpu: 0
  concat_threads: 4
  concat_mem_mb: 64000
