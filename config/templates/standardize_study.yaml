# Template for one study's standardize spec. Copy it to
# <your profile>/standardize/<study>.yaml, keep one input shape, and delete the rest.
# The file name, `study` and the output path must all use the same study name.
study: "STUDY_A"

input:
  # Shape 1: one 10x triplet per sample or run. Cleaners: count_matrix_10x_multi_runs, tenx_h5_multi.
  # runs_csv needs study_accession, include, donor_id, sample_id and run_id columns.
  triplet_root: "/path/to/counts/STUDY_A"
  triplet_layout: "{triplet_root}/{sample_id}_matrix/filtered"
  runs_csv: "/path/to/samples.csv"

  # Shape 2: one 10x .h5 per sample. Cleaner: tenx_h5_multi only.
  # samples:
  #   - sample_id: "SAMPLE_1"
  #     h5: "/path/to/SAMPLE_1.h5"

  # Shape 3: one count table per sample in a folder. Cleaner: csv_handler or count_txt, then tenx_h5_multi.
  # raw_dir: "/path/to/raw/STUDY_A"

  # Shape 4: one combined matrix. Cleaner: count_matrix_10x, then tenx_h5_multi.
  # matrix: "/path/to/counts.mtx.gz"
  # genes: "/path/to/genes.csv"
  # barcodes: "/path/to/cells.csv"
  # metadata: "/path/to/metadata.csv"

  workers: 4

  # Mitochondrial gene prefix for the raw QC plots: "MT-" for human, "mt-" for mouse.
  mito_gene_prefix: "MT-"

  # Cell filtering. Leave this block out to keep every cell and pick cutoffs from
  # out/<study>/qc_raw/ first. Only the last cleaner, tenx_h5_multi, applies it, so
  # every pipeline should end with that cleaner. Use the same values across studies you
  # intend to compare, or state the difference in your methods.
  qc:
    method: "mad"
    k: 3
    mito_upper_k: 5
    mito_gene_prefix: "MT-"
    miqc_posterior_cutoff: 0.75
    doublet_score_threshold: 0.25

pipeline:
  cleaner1: "count_matrix_10x_multi_runs"
  cleaner2: "tenx_h5_multi"

output:
  h5ad: "out/STUDY_A/raw.h5ad"
